openapi: 3.0.3
info:
  title: IPChat API
  version: 1.1.0
servers:
  - url: http://localhost:8080
paths:
  /api/register:
    post:
      security: []
      responses:
        '201': {description: Registered}
  /api/login:
    post:
      security: []
      responses:
        '200': {description: Authenticated}
  /api/logout:
    post:
      security:
        - bearerAuth: []
      responses:
        '200': {description: Logged out}
  /api/ws-ticket:
    post:
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: room
          required: true
          schema: {type: string}
      responses:
        '200': {description: Single-use ticket}
  /api/rooms:
    get:
      security:
        - bearerAuth: []
      responses:
        '200': {description: Joined rooms}
  /health/live:
    get:
      security: []
      responses:
        '200': {description: Alive}
  /health/ready:
    get:
      security: []
      responses:
        '200': {description: Ready}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
